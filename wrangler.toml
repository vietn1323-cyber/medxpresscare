#:schema node_modules/wrangler/config-schema.json
name = "medxpresscare"
compatibility_date = "2026-10-23"
main = "worker.js"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "medxpress_db"
database_id = "5b89c664-cab0-49b3-b8f5-33df0e448862"

[ai]
binding = "AI"

[observability]
enabled = true
[observability.logs]
enabled = true
invocation_logs = true
